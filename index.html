<html lang="es">
<head>

<title>ConCiencia</title>

<style>
:root{--bg:#FFFFFF;--ink:#2E2650;--muted:#6B6585;--line:#ECE8F6;--lav:#B7A6EE;--lav-soft:#F4F1FD;--tang:#EE8445;--tang-soft:#FDEBDD;--focus:#5B45C9;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:1.0625rem;line-height:1.5;display:flex;flex-direction:column}
img{max-width:100%;display:block}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.display{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.25rem .4rem;max-width:40rem;width:100%;margin:0 auto}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.1rem;text-decoration:none}
.sub-title{font-size:.78rem;color:var(--muted);text-align:right}
.progress{height:4px;background:var(--line);max-width:40rem;width:calc(100% - 2.5rem);margin:0 auto;border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--tang);width:0;transition:width .3s ease}
main{flex:1;overflow-y:auto;display:flex}
.slide{margin:auto;width:100%;max-width:34rem;padding:1.5rem 1.25rem 2rem;text-align:center}
.thanks h1{font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.1;margin:0 0 .75rem;font-weight:800;letter-spacing:-.015em}
.thanks p,.lead{margin:0;font-size:1.15rem;color:var(--muted)}
.arrow{width:4.5rem;height:4.5rem;margin:1.25rem auto .5rem;color:var(--tang)}
.btn{display:inline-block;font-weight:700;cursor:pointer;border-radius:999px;padding:.85rem 1.6rem;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-size:1.1rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.big-icon{width:min(13rem,55vw);height:min(13rem,55vw);object-fit:contain;margin:0 auto 1.25rem}
.q-text{font-size:.95rem;color:var(--muted);margin:0 auto .6rem;max-width:28rem}
.msg{font-size:clamp(1.3rem,5vw,1.6rem);line-height:1.3;font-weight:700;margin:0 auto;max-width:28rem;text-wrap:balance}
.msg strong{color:var(--tang);font-weight:800;white-space:nowrap}
.people{display:flex;justify-content:center;gap:.35rem;margin:1.5rem 0 .4rem}
.person{width:1.9rem;height:2.6rem}
.person .fig{fill:var(--lav-soft);stroke:var(--lav);stroke-width:2.2}
.person.like .fig{fill:var(--tang);stroke:var(--tang)}
.scope{margin:1.75rem auto 0}
.scope-label{font-size:.9rem;color:var(--muted);margin:0 0 .45rem}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem}
.seg button{font-size:.92rem;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);padding:.42rem .8rem;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.n{font-size:.85rem;color:var(--muted);margin:.5rem 0 0}
.many-icons{display:flex;justify-content:center;flex-wrap:wrap;gap:.75rem;margin:0 auto 1.25rem}
.many-icons img{width:min(7.5rem,28vw);height:min(7.5rem,28vw);object-fit:contain}
.others-btn{margin:1.75rem auto 0}
.others{list-style:none;margin:1.25rem auto 0;padding:0;display:grid;gap:.6rem;text-align:left;max-width:28rem}
.o-row{display:grid;grid-template-columns:2.4rem 1fr 3rem;gap:.7rem;align-items:center}
.o-row img{width:2.4rem;height:2.4rem;object-fit:contain}
.o-label{font-size:.95rem;line-height:1.3}
.o-row.mine .o-label{font-weight:700}
.tu{font-size:.75rem;font-weight:700;color:var(--tang);margin-left:.35rem}
.track{height:.5rem;border-radius:999px;background:var(--lav-soft);overflow:hidden;margin-top:.3rem}
.fill{height:100%;border-radius:inherit;background:var(--lav)}
.o-row.mine .fill{background:var(--tang)}
.pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.idea blockquote{margin:0 auto;font-size:1.2rem;font-style:italic;max-width:26rem}
.idea .sub{color:var(--muted);margin:.9rem auto 0;max-width:26rem}
.privacy{font-size:.8rem;color:var(--muted);margin:2rem auto 0;max-width:26rem}
.list{list-style:none;padding:0;margin:1.5rem auto 0;display:grid;gap:.75rem;text-align:left;max-width:28rem}
.list a{display:block;padding:1rem 1.1rem;border:1.5px solid var(--line);border-radius:1rem;text-decoration:none}
.list a:hover{border-color:var(--lav)}
.list small{display:block;color:var(--muted)}
.spinner{width:2.5rem;height:2.5rem;border:4px solid var(--lav-soft);border-top-color:var(--tang);border-radius:50%;margin:1.5rem auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem 1rem;max-width:40rem;width:100%;margin:0 auto}
.nav button{cursor:pointer;border:none;background:none;font-weight:700;display:inline-flex;align-items:center;gap:.45rem;padding:.6rem .4rem;font-size:1rem}
.nav .next{background:var(--ink);color:var(--bg);border-radius:999px;padding:.7rem 1.2rem}
.nav .prev{color:var(--muted)}
.nav[hidden],.nav button[hidden]{display:none}
.nav svg{width:1.25rem;height:1.25rem}
.count{font-size:.85rem;color:var(--muted)}
.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.enter{animation:none}.progress span{transition:none}.spinner{animation-duration:3s}}
</style>
</head>

// ---------- Lanzador: crea el token y abre la encuesta en KoboToolbox ----------
function lanzar() {
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  const tk = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  const vuelta = location.origin + location.pathname + `?e=${codigo}&t=${tk}`;
  const url = `https://ee.kobotoolbox.org/single/${enc.enketo}?d[/data/token]=${tk}&d[/${enc.uid}/token]=${tk}&return_url=${encodeURIComponent(vuelta)}`;
  main.innerHTML = `<div class="slide"><p class="lead">Abriendo la encuesta «${esc(enc.titulo)}»…</p><div class="spinner"></div>
    <p><a class="btn ghost" href="${esc(url)}">Abrir la encuesta</a></p></div>`;
  location.replace(url);
}

  const s = [{kind: "thanks"}];
  enc.preguntas.forEach(p => {
    const v = datos.respuestas[p.id];
    if (!v) return;
    if (p.tipo === "abierta") { s.push({kind: "idea", p, texto: v}); return; }
    const sel = String(v).split(" ").map(n => p.opciones.findIndex(o => o[0] === n)).filter(i => i >= 0);
    if (sel.length) s.push({kind: sel.length > 1 ? "many" : "one", p, sel});
  });
  // Solo una diapositiva de idea (la primera respondida), al final
  const ideas = s.filter(x => x.kind === "idea");
  return s.filter(x => x.kind !== "idea").concat(ideas.slice(0, 1));
}

      const rows = p.opciones.map((o, i) => `<li class="o-row${sl.sel.includes(i) ? " mine" : ""}">${img(o[2], "")}<div><span class="o-label">${esc(o[1])}${sl.sel.includes(i) ? '<span class="tu">tu respuesta</span>' : ""}</span>
        <div class="track"><div class="fill" style="width:${pc[i]}%"></div></div></div><span class="pct">${pc[i]}\u00A0%</span></li>`).join("");
      otras = `<button class="btn ghost others-btn" type="button" id="others" aria-expanded="${showOthers}" aria-controls="ol">Otras respuestas</button>
        <div id="ol" ${showOthers ? "" : "hidden"}><ul class="others">${rows}</ul><p class="note">Respuestas en ${esc(lugar(scope))}. Cada persona podía elegir varias opciones.</p></div>`; }
    h = `<div class="slide"><div class="many-icons">${sl.sel.map(i => img(p.opciones[i][2], "Tu respuesta: " + p.opciones[i][1])).join("")}</div>${pq(p)}
      <p class="msg display">${mensaje(p, sl.sel)}</p>${otras}</div>`;
  } else {
    const a = scope && datos.ambitos[scope].preguntas[sl.p.id];
    h = `<div class="slide idea">${img("R_idea", "Tu idea", "big-icon")}<p class="q-text">${esc(sl.p.texto)}</p>
      <blockquote class="display">“${esc(sl.texto)}”</blockquote>
      ${a ? `<p class="sub">Tu idea se suma a ${fmt(a.respondidas)} ideas de ${esc(lugar(scope))}. Publicaremos las propuestas más repetidas.</p>` : ""}
      <p class="privacy">Tus respuestas se ubican en el mapa de tu parroquia, nunca en tu dirección exacta. Los resultados se publican como datos abiertos (CC BY 4.0).</p>
      <p style="margin-top:1.5rem"><a class="btn ghost" href="./">Responder otra encuesta</a></p></div>`;
  }
  main.innerHTML = h;
  if (animate && main.firstElementChild) main.firstElementChild.classList.add("enter");
  main.scrollTop = 0;
  const total = slidesCache.length;
  const nav = document.getElementById("nav");
  nav.hidden = !datos || current === 0;
  document.getElementById("prev").hidden = current <= 1;
  document.getElementById("next").hidden = current >= total - 1;
  document.getElementById("count").textContent = current ? `${current} de ${total - 1}` : "";
  document.getElementById("prog").style.width = total > 1 ? (current / (total - 1) * 100) + "%" : "0";
  main.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (b.getAttribute("aria-disabled") === "true") return; scope = b.dataset.scope; render(false); }));
  const go = document.getElementById("go"); if (go) go.addEventListener("click", () => { if (datos) goTo(1); else if (terminado) main.innerHTML = `<div class="slide"><p class="lead">Tus resultados aún no están listos. Guarda este enlace y vuelve a abrirlo en unos minutos.</p></div>`; else { esperando = true; render(false); } });
  const ot = document.getElementById("others"); if (ot) ot.addEventListener("click", () => { showOthers = !showOthers; render(false); document.getElementById("others").focus(); });
}
function goTo(i) { if (!datos || i < 0 || i >= slidesCache.length) return; current = i; showOthers = false; render(true); }

function resultados() {
  document.getElementById("subtitulo").textContent = enc.titulo;
  document.getElementById("next").addEventListener("click", () => goTo(current + 1));
  document.getElementById("prev").addEventListener("click", () => goTo(current - 1));
  document.addEventListener("keydown", e => { if (!current) return; if (e.key === "ArrowRight") goTo(current + 1); if (e.key === "ArrowLeft" && current > 1) goTo(current - 1); });
  let tx = null;
  main.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive: true});
  main.addEventListener("touchend", e => { if (tx === null || !current) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (dx < -60) goTo(current + 1); else if (dx > 60 && current > 1) goTo(current - 1); });
  render(false);
  pedir().then(() => {
    if (!datos) { if (!esperando) return; main.innerHTML = `<div class="slide"><p class="lead">Tus resultados aún no están listos. Guarda este enlace y vuelve a abrirlo en unos minutos.</p></div>`; return; }
    if (esperando) goTo(1);
  });
}

if (!enc) portal(); else if (!token) lanzar(); else resultados();
</script>
</body>
</html>
